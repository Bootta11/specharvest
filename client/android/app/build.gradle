apply plugin: 'com.android.application'

// Release signing (both files git-ignored, see the *.example files):
// - app-signing.properties: the app signing key, signs the direct APK (Zealot) — docs/app-updates.md;
// - keystore.properties: the upload key, signs the Play bundle — docs/google-play.md.
def loadProperties(String name) {
    def file = rootProject.file(name)
    def props = new Properties()
    if (file.exists()) file.withInputStream { props.load(it) }
    return file.exists() ? props : null
}
def appSigning = loadProperties('app-signing.properties')
def uploadSigning = loadProperties('keystore.properties')

// CI passes the version from the git tag (vX.Y.Z → -PversionName=X.Y.Z -PversionCode=X*10000+Y*100+Z).
def appVersionCode = (project.findProperty('versionCode') ?: '1') as Integer
def appVersionName = (project.findProperty('versionName') ?: '1.0') as String

android {
    namespace = "dev.bootta.specharvest"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.bootta.specharvest"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // From the git tag in CI (see above); every Play upload and Zealot release needs a higher versionCode.
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        [app: appSigning, upload: uploadSigning].each { name, props ->
            if (props != null) {
                create(name) {
                    storeFile rootProject.file(props['storeFile'])
                    storePassword props['storePassword']
                    keyAlias props['keyAlias']
                    keyPassword props['keyPassword']
                }
            }
        }
    }
    // direct: the APK on Zealot, which updates itself (src/direct). play: the Google Play bundle, which can't.
    flavorDimensions = ["store"]
    productFlavors {
        direct {
            dimension "store"
            if (appSigning != null) signingConfig signingConfigs.app
        }
        play {
            dimension "store"
            if (uploadSigning != null) signingConfig signingConfigs.upload
        }
    }
    buildTypes {
        debug {
            // Debug builds use the debug key, whatever the flavor says.
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
