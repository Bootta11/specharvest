# Test → build + scan + smoke-test the image → publish to GHCR (only when both passed).
# Tags: sha-<commit> on every push, latest on master, x.y.z on v* git tags.
# Actions are pinned to commit SHAs (a moved tag can't change what runs); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/bootta11/specharvest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm 10 hits an arborist bug on this dependency tree; pin npm 11 regardless of the bundled npm.
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      # Known vulnerabilities in what ships (dev tools excluded) fail the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      # UI bundles must not reach APKs with older native code (docs/app-updates.md#the-native-baseline).
      - run: node scripts/native-baseline.mjs --check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: specharvest:ci
          build-args: GIT_SHA=${{ github.sha }}
          # Signs the Android app's live-update bundle (docs/app-updates.md#bundle-signing); empty on fork PRs.
          secrets: bundle_key=${{ secrets.APP_BUNDLE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: specharvest:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (container becomes healthy, health reports ok)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:3100:3100 specharvest:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ]; then
              curl -fsS http://127.0.0.1:3100/api/health | grep -q '"ok":true' && exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

  publish:
    needs: [test, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance + SBOM attached to the image (docker buildx imagetools inspect --format '{{json .SBOM}}').
          provenance: mode=max
          sbom: true
          build-args: GIT_SHA=${{ github.sha }}
          # Signs the Android app's live-update bundle (docs/app-updates.md#bundle-signing); empty on fork PRs.
          secrets: bundle_key=${{ secrets.APP_BUNDLE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Android app on v* tags (docs/app-updates.md#releasing): the direct APK goes to Zealot, the Play bundle is kept
  # as an artifact. The android-release environment holds the signing secrets and only allows tags.
  android:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "Tag must be vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Build the web UI into the Android project
        run: npm run cap:sync --workspace client
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Signing keys
        env:
          APP_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          APP_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # Java properties: backslashes would be read as escapes.
          props() { printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$1" "${2//\\/\\\\}" "$3" "${4//\\/\\\\}"; }
          echo "$APP_KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.jks"
          props "$RUNNER_TEMP/app.jks" "$APP_STORE_PASSWORD" "$APP_KEY_ALIAS" "$APP_KEY_PASSWORD" > client/android/app-signing.properties
          # The Play upload key is optional until the app is on Play.
          if [ -n "$UPLOAD_KEYSTORE" ]; then
            echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            props "$RUNNER_TEMP/upload.jks" "$UPLOAD_STORE_PASSWORD" "$UPLOAD_KEY_ALIAS" "$UPLOAD_KEY_PASSWORD" > client/android/keystore.properties
            echo "UPLOAD_KEY=1" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: client/android
        run: |
          tasks="assembleDirectRelease"
          [ -n "${UPLOAD_KEY:-}" ] && tasks="$tasks bundlePlayRelease"
          ./gradlew $tasks -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}
      - name: Check the APK's signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs client/android/app/build/outputs/apk/direct/release/app-direct-release.apk
      - name: Upload to Zealot
        env:
          ZEALOT_TOKEN: ${{ secrets.ZEALOT_API_TOKEN }}
          ZEALOT_CHANNEL_KEY: ${{ vars.ZEALOT_CHANNEL_KEY }}
        run: |
          # The changelog is the annotated tag's message (falls back to the commit subject). Checkout leaves the tag
          # lightweight, so fetch the real one first.
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          changelog=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          [ -n "$changelog" ] || changelog=$(git log -1 --format=%s)
          curl -fsS --retry 3 \
            -F "file=@client/android/app/build/outputs/apk/direct/release/app-direct-release.apk" \
            -F "channel_key=$ZEALOT_CHANNEL_KEY" \
            -F "token=$ZEALOT_TOKEN" \
            -F "release_type=release" \
            -F "changelog=$changelog" \
            -F "branch=$GITHUB_REF_NAME" \
            -F "git_commit=$GITHUB_SHA" \
            -F "ci_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            https://apps.bootta.dev/api/apps/upload
      - name: Keep the Play bundle
        if: env.UPLOAD_KEY == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specharvest-play-${{ steps.version.outputs.name }}
          path: client/android/app/build/outputs/bundle/playRelease/app-play-release.aab
